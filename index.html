<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Microsite BPS1900</title>
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

<div class="topbar">
  <div class="brand">
    <img src="assets/img/logo.png" alt="Logo" class="brand-mark" />
    <span id="orgName">Microsite Rapat</span>
  </div>
  <button type="button" id="openLoginBtn" class="admin-link-img" aria-label="Login Admin">
    <img src="assets/img/bps.png" alt="" />
  </button>
</div>

<!-- ===== MODAL LOGIN ADMIN ===== -->
<div class="overlay hidden" id="loginOverlay">
  <div class="panel login-panel">
    <button type="button" class="modal-close" id="closeLoginBtn" aria-label="Tutup">&times;</button>
    <h3>Login Admin</h3>
    <div class="error-msg hidden" id="loginError"></div>
    <form id="loginForm">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required />
      </div>
      <button class="btn btn-primary" style="width:100%" type="submit">Masuk</button>
    </form>
  </div>
</div>


<section class="hero-band">
  <div class="hero-meta">
    <span class="pill" id="countUpcoming">0 rapat mendatang</span>
    <span class="pill orange" id="countToday" style="display:none;">Ada rapat hari ini</span>
  </div>
</section>

<div class="toolbar">
  <input type="search" id="searchInput" placeholder="Cari judul rapat..." />
  <select id="filterStatus">
    <option value="all">Semua</option>
    <option value="upcoming">Akan datang</option>
    <option value="done">Sudah selesai</option>
  </select>
</div>

<div class="timeline" id="timeline">
  <div class="loading-block"><div class="spinner"></div><p>Memuat jadwal rapat...</p></div>
</div>

<footer class="site-footer">
  <img src="assets/img/iso.png" alt="ISO" class="footer-sponsor" />
</footer>

<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
